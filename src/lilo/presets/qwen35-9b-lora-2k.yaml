api_version: lilo/v1
name: qwen35-9b-lora-2k
model:
  id: Qwen/Qwen3.5-9B-Base
  parameterization: lora
  max_context_length: 2048
routing:
  default: false
trainer:
  backend: miles
  resources:
    gpu: H200:4
  engine:
    max_clients_per_instance: 4
    sampler_persistence_concurrency: 8
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TORCHINDUCTOR_COMPILE_THREADS: '1'
  config:
    model_args: qwen3.5-9B
    options:
      tensor_model_parallel_size: 4
      target_modules:
      - linear_qkv
      - linear_proj
      - linear_fc1
      - linear_fc2
      - output_layer
      max_tokens_per_gpu: 2048
      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
      multi_lora_n_adapters: 4
      lora_rank: 32
      lora_alpha: 32
inference:
  resources:
    gpu: H200:1
  scaling:
    min_replicas: 0
    max_replicas: 8
    target_concurrency: 16
  config:
    tp_size: 1
    ep_size: 1
    mem_fraction_static: 0.8
    max_running_requests: 32
    max_queued_requests: 8
    max_loaded_loras: 32
    max_loras_per_batch: 8
    lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - lm_head
    schedule_policy: lpm
