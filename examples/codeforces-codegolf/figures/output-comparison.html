    &lt;section&gt;&lt;h3&gt;Recent comparison · step 620&lt;/h3&gt;&lt;p id=&quot;golf-after-stats&quot; class=&quot;tabular-nums&quot;&gt;&lt;/p&gt;&lt;textarea class=&quot;form-control&quot; rows=&quot;24&quot; readonly aria-label=&quot;Recent response&quot; id=&quot;golf-after&quot;&gt;&lt;/textarea&gt;&lt;/section&gt;
  &lt;/div&gt;
  &lt;script type=&quot;application/json&quot; id=&quot;golf-output-data&quot;&gt;[{&quot;slug&quot;: &quot;magnets&quot;, &quot;earlier&quot;: {&quot;step&quot;: 150, &quot;tokens&quot;: 8990, &quot;code_bytes&quot;: 1771, &quot;passed&quot;: true, &quot;tests_run&quot;: 73, &quot;truncated&quot;: false, &quot;text&quot;: &quot;To solve this problem, we need to understand how the magnets form groups.\n\n**Problem Analysis:**\n1.  **Magnet Configuration**: Each magnet is placed horizontally and has two poles. The input gives us the orientation as a string of two characters: \&quot;01\&quot; (plus-minus) or \&quot;10\&quot; (minus-plus). Let&#x27;s map &#x27;0&#x27; to minus and &#x27;1&#x27; to plus for clarity, though the specific mapping doesn&#x27;t matter as much as the relative order.\n    *   \&quot;01\&quot;: Left side is 0, Right side is 1.\n    *   \&quot;10\&quot;: Left side is 1, Right side is 0.\n2.  **Interaction Rule**:\n    *   Magnets are added to the right end of the row.\n    *   If the right pole of the current magnet attracts the left pole of the next magnet, they link up (forming the same group).\n    *   If they repel, the new magnet starts a new group.\n    *   Wait, let&#x27;s re-read the physics description carefully: \&quot;like poles will repel each other and the opposite poles will attract each other.\&quot;\n    *   However, the problem statement simplifies the condition for grouping: \&quot;Depending on how Mike puts the magnet on the table, it is either attracted to the previous one (forming a group of multiple magnets linked together) or repelled by it (then Mike lays this magnet at some distance to the right from the previous one).\&quot;\n    *   Let&#x27;s look at the connection point. The connection happens between the **right pole of the $i$-th magnet** and the **left pole of the $(i+1)$-th magnet**.\n    *   If the right pole of magnet $i$ is different from the left pole of magnet $i+1$, they attract -&gt; same group.\n    *   If the right pole of magnet $i$ is the same as the left pole of magnet $i+1$, they repel -&gt; new group.\n\nLet&#x27;s trace the examples to verify this logic.\n\n**Example 1:**\nInput:\n6 magnets\n1. `10` (Left: 1, Right: 0)\n2. `10` (Left: 1, Right: 0)\n   - Connection between mag 1 (Right: 0) and mag 2 (Left: 1). 0 and 1 are opposite -&gt; Attract. Same group.\n3. `10` (Left: 1, Right: 0)\n   - Connection between mag 2 (Right: 0) and mag 3 (Left: 1). 0 and 1 are opposite -&gt; Attract. Same group.\n4. `01` (Left: 0, Right: 1)\n   - Connection between mag 3 (Right: 0) and mag 4 (Left: 0). 0 and 0 are like -&gt; Repel. New group starts here.\n5. `10` (Left: 1, Right: 0)\n   - Connection between mag 4 (Right: 1) and mag 5 (Left: 1). 1 and 1 are like -&gt; Repel. New group starts here.\n6. `10` (Left: 1, Right: 0)\n   - Connection between mag 5 (Right: 0) and mag 6 (Left: 1). 0 and 1 are opposite -&gt; Attract. Same group.\n\nGroups formed:\n- Group 1: Magnets 1, 2, 3\n- Group 2: Magnet 4\n- Group 3: Magnets 5, 6\nTotal groups: 3.\nThis matches the example output.\n\n**Example 2:**\nInput:\n4 magnets\n1. `01` (L:0, R:1)\n2. `01` (L:0, R:1)\n   - Mag 1 Right (1) vs Mag 2 Left (0). Opposite -&gt; Attract. Same group.\n3. `10` (L:1, R:0)\n   - Mag 2 Right (1) vs Mag 3 Left (1). Like -&gt; Repel. New group.\n4. `10` (L:1, R:0)\n   - Mag 3 Right (0) vs Mag 4 Left (1). Opposite -&gt; Attract. Same group.\n\nGroups:\n- Group 1: Magnets 1, 2\n- Group 2: Magnets 3, 4\nTotal groups: 2.\nMatches example output.\n\n**General Logic:**\nA new group starts with the first magnet (index 0). For every subsequent magnet $i$ (from 1 to $n-1$), we check if it forms a new group compared to magnet $i-1$.\nIt forms a new group if the configuration changes such that the right pole of $i-1$ equals the left pole of $i$.\nLet&#x27;s denote the string for magnet $j$ as $S_j$.\n$S_j$ is either \&quot;01\&quot; or \&quot;10\&quot;.\nRight pole of $S_{i-1}$ is $S_{i-1}[1]$.\nLeft pole of $S_i$ is $S_i[0]$.\nIf $S_{i-1}[1] == S_i[0]$, then they repel, and a new group starts.\nOtherwise ($S_{i-1}[1] \\neq S_i[0]$), they attract, and the current group continues.\n\nNotice a pattern:\n- \&quot;01\&quot; ends with &#x27;1&#x27;.\n- \&quot;10\&quot; ends with &#x27;0&#x27;.\n- If current is \&quot;01\&quot; and next is \&quot;01\&quot;: &#x27;1&#x27; == &#x27;0&#x27;? No. Connect.\n- If current is \&quot;01\&quot; and next is \&quot;10\&quot;: &#x27;1&#x27; == &#x27;1&#x27;? Yes. Break.\n- If current is \&quot;10\&quot; and next is \&quot;01\&quot;: &#x27;0&#x27; == &#x27;0&#x27;? Yes. Break.\n- If current is \&quot;10\&quot; and next is \&quot;10\&quot;: &#x27;0&#x27; == &#x27;1&#x27;? No. Connect.\n\nWait, let&#x27;s re-evaluate the condition $S_{i-1}[1] == S_i[0]$.\nCase 1: $S_{i-1} = \&quot;01\&quot;$, $S_i = \&quot;01\&quot;$. $S_{i-1}[1] = &#x27;1&#x27;$, $S_i[0] = &#x27;0&#x27;$. &#x27;1&#x27; != &#x27;0&#x27;. Connect.\nCase 2: $S_{i-1} = \&quot;01\&quot;$, $S_i = \&quot;10\&quot;$. $S_{i-1}[1] = &#x27;1&#x27;$, $S_i[0] = &#x27;1&#x27;$. &#x27;1&#x27; == &#x27;1&#x27;. Break (New Group).\nCase 3: $S_{i-1} = \&quot;10\&quot;$, $S_i = \&quot;01\&quot;$. $S_{i-1}[1] = &#x27;0&#x27;$, $S_i[0] = &#x27;0&#x27;$. &#x27;0&#x27; == &#x27;0&#x27;. Break (New Group).\nCase 4: $S_{i-1} = \&quot;10\&quot;$, $S_i = \&quot;10\&quot;$. $S_{i-1}[1] = &#x27;0&#x27;$, $S_i[0] = &#x27;1&#x27;$. &#x27;0&#x27; != &#x27;1&#x27;. Connect.\n\nSo, a new group starts when the string changes from \&quot;01\&quot; to \&quot;10\&quot; OR from \&quot;10\&quot; to \&quot;01\&quot;.\nEssentially, whenever $S_i \\neq S_{i-1}$, does that mean a new group?\nLet&#x27;s check Case 1: \&quot;01\&quot; -&gt; \&quot;01\&quot;. Strings are equal. Connect. Correct.\nCase 4: \&quot;10\&quot; -&gt; \&quot;10\&quot;. Strings are equal. Connect. Correct.\nCase 2: \&quot;01\&quot; -&gt; \&quot;10\&quot;. Strings are different. Break. Correct.\nCase 3: \&quot;10\&quot; -&gt; \&quot;01\&quot;. Strings are different. Break. Correct.\n\nHypothesis: The number of groups is simply $1 + \\text{count of indices } i \\text{ where } S_i \\neq S_{i-1}$.\nOr simply, count how many times the configuration changes. Since the first magnet always starts group #1, the total groups = $1 + \\sum_{i=1}^{n-1} (S_i \\neq S_{i-1})$.\n\nLet&#x27;s double check with Example 1:\nSequence: 10, 10, 10, 01, 10, 10\ni=1: 10 vs 10 (Same) -&gt; count=0\ni=2: 10 vs 10 (Same) -&gt; count=0\ni=3: 10 vs 01 (Diff) -&gt; count=1\ni=4: 01 vs 10 (Diff) -&gt; count=2\ni=5: 10 vs 10 (Same) -&gt; count=2\nTotal groups = 1 + 2 = 3. Correct.\n\nExample 2:\nSequence: 01, 01, 10, 10\ni=1: 01 vs 01 (Same)\ni=2: 01 vs 10 (Diff) -&gt; count=1\ni=3: 10 vs 10 (Same)\nTotal groups = 1 + 1 = 2. Correct.\n\n**Algorithm:**\n1. Read $n$.\n2. Read the first magnet string. Initialize `groups = 1`.\n3. Loop $n-1$ times to read the remaining magnets.\n4. For each new magnet, compare it with the previous one.\n5. If different, increment `groups`.\n6. Update previous magnet to the current one.\n7. Print `groups`.\n\n**Complexity:**\nTime Complexity: $O(n)$ to read and process $n$ lines. Given $n \\le 100000$, this is well within limits for Python.\nSpace Complexity: $O(1)$ if we process line by line without storing the whole list, just keeping the previous string.\n\n**Implementation Details:**\n- Use `sys.stdin.read().split()` to get all tokens efficiently.\n- The first token is $n$.\n- The subsequent $n$ tokens are the magnet strings.\n- Iterate through the list of strings starting from index 1, comparing with index $i-1$.\n\nLet&#x27;s write the code.\n\n```python\nimport sys\n\ndef solve():\n    # Read all input from stdin\n    data = sys.stdin.read().split()\n    \n    if not data:\n        return\n    \n    n = int(data[0])\n    # The magnets are from data[1] to data[n]\n    # We can iterate through them directly\n    \n    # If n is 0, though constraints say n &gt;= 1\n    if n == 0:\n        print(0)\n        return\n ; and the left end is &#x27;0&#x27;, they repel. If the right end is &#x27;1&#x27; and the left end is &#x27;0&#x27;, they attract. If the right end is &#x27;0&#x27; and the left end is &#x27;1&#x27;, they attract.\n\nLet&#x27;s look at the examples to confirm the grouping logic.\nExample 1:\nn = 6\nMagnets:\n1. \&quot;10\&quot; (Right pole is &#x27;0&#x27;)\n2. \&quot;10\&quot; (Left pole is &#x27;1&#x27;, Right pole is &#x27;0&#x27;)\n3. \&quot;10\&quot; (Left pole is &#x27;1&#x27;, Right pole is &#x27;0&#x27;)\n4. \&quot;01\&quot; (Left pole is &#x27;0&#x27;, Right pole is &#x27;1&#x27;)\n5. \&quot;10\&quot; (Left pole is &#x27;1&#x27;, Right pole is &#x27;0&#x27;)\n6. \&quot;10\&quot; (Left pole is &#x27;1&#x27;, Right pole is &#x27;0&#x27;)\n\nLet&#x27;s trace the interaction:\n- Magnet 1: \&quot;10\&quot;. Ends with &#x27;0&#x27;.\n- Magnet 2: \&quot;10\&quot;. Starts with &#x27;1&#x27;. The previous magnet ended with &#x27;0&#x27;, and this one starts with &#x27;1&#x27;. Opposite poles attract. So Magnet 2 is attracted to Magnet 1. They form a group.\n- Magnet 3: \&quot;10\&quot;. Starts with &#x27;1&#x27;. The previous magnet (Magnet 2) ended with &#x27;0&#x27;. Opposite poles attract. So Magnet 3 is attracted to Magnet 2. They are in the same group.\n- Magnet 4: \&quot;01\&quot;. Starts with &#x27;0&#x27;. The previous magnet (Magnet 3) ended with &#x27;0&#x27;. Like poles repel (&#x27;0&#x27; and &#x27;0&#x27;). So Magnet 4 is repelled and forms a new group.\n- Magnet 5: \&quot;10\&quot;. Starts with &#x27;1&#x27;. The previous magnet (Magnet 4) ended with &#x27;1&#x27;. Opposite poles attract (&#x27;1&#x27; and &#x27;0&#x27; from previous? No, previous ended with &#x27;1&#x27;, current starts with &#x27;1&#x27;). Wait, let&#x27;s re-check the poles.\n  - Magnet 4 is \&quot;01\&quot;, so right pole is &#x27;1&#x27;.\n  - Magnet 5 is \&quot;10\&quot;, so left pole is &#x27;1&#x27;.\n  - Right pole of Magnet 4 is &#x27;1&#x27;, Left pole of Magnet 5 is &#x27 ich is efficient enough.\n\nLet&#x27;s re-verify the logic one more time with the first example.\nInput:\n6\n10\n10\n10\n01\n10\n10\n\ni=1: prev=\&quot;10\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;0&#x27;, curr[0]=&#x27;1&#x27;. Not equal. groups=1.\ni=2: prev=\&quot;10\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;0&#x27;, curr[0]=&#x27;1&#x27;. Not equal. groups=1.\ni=3: prev=\&quot;10\&quot;, curr=\&quot;01\&quot;. prev[-1]=&#x27;0&#x27;, curr[0]=&#x27;0&#x27;. Equal. groups=2.\ni=4: prev=\&quot;01\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;1&#x27;, curr[0]=&#x27;1&#x27;. Equal. groups=3.\ni=5: prev=\&quot;10\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;0&#x27;, curr[0]=&#x27;1&#x27;. Not equal. groups=3.\n\nFinal answer: 3. Correct.\n\nSecond example:\nInput:\n4\n01\n01\n10\n10\n\ni=1: prev=\&quot;01\&quot;, curr=\&quot;01\&quot;. prev[-1]=&#x27;1&#x27;, curr[0]=&#x27;0&#x27;. Not equal. groups=1.\ni=2: prev=\&quot;01\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;1&#x27;, curr[0]=&#x27;1&#x27;. Equal. groups=2.\ni=3: prev=\&quot;10\&quot;, curr=\&quot;10\&quot;. prev[-1]=&#x27;0&#x27;, curr[0]=&#x27;1&#x27;. Not equal. groups=2.\n\nFinal answer: 2. Correct.\n\nThe logic seems solid.\n\nOne edge case: n=1. The loop range(1, 1) is empty, so groups remains 1. Correct.\n\nThe code looks good.\n\n```python\nn = int(input())\nmagnets = []\nfor _ in range(n):\n    magnets.append(input())\n\ngroups = 1\nfor i in range(1, n):\n    prev_magnet = magnets[i-1]\n    curr_magnet = magnets[i]\n    if prev_magnet[-1] == curr_magnet[0]:\n        groups += 1\n\nprint(groups)\n```\n\nThis is the final solution.&quot;, &quot;code&quot;: &quot;n = int(input())\nmagnets = []\nfor _ in range(n):\n    magnets.append(input())\n\ngroups = 1\nfor i in range(1, n):\n    prev_magnet = magnets[i-1]\n    curr_magnet = magnets[i]\n    if prev_magnet[-1] == curr_magnet[0]:\n        groups += 1\n\nprint(groups)&quot;}, &quot;problem&quot;: &quot;344_A. Magnets&quot;}, {&quot;slug&quot;: 0:\n                mid_x = (x1 + x2) // 2\n                mid_y = (y1 + y2) // 2\n                if (mid_x, mid_y) in point_set:\n                    count += 1\n                    \n    print(count)\n\nif __name__ == \&quot;__main__\&quot;:\n    solve()\n```\n\nThis is the final code.\n\nOne more check on constraints: n \u003c= 3000. The nested loop runs approximately n^2/2 times. For n=3000, that&#x27;s 4.5 million iterations. Inside the loop, we do constant time operations. This should pass comfortably within 1 second.\n\nLet&#x27;s consider an alternative interpretation. Could the problem be asking for ordered triplets? \&quot;The groups of three points are considered unordered, that is, if point B is the middle of segment AC, then groups (A, B, C) and (C, B, A) are considered the same.\&quot; This confirms we are counting sets {A, B, C}, not sequences. Our method counts each set exactly once because we fix the pair (A, C) and find B. Since (A, C) is the same pair as (C, A), and we only process each pair once (i \u003c j), we count each valid configuration exactly once.\n\nCorrect.\n\n```python\nimport sys\n\ndef solve():\n    n = int(sys.stdin.readline())\n    points = []\n    for _ in range(n):\n        x, y = map(int, sys.stdin.readline().split())\n        points.append((x, y))\n    \n    point_set = set(points)\n    count = 0\n    \n    for i in range(n):\n        for j in range(i + 1, n):\n            x1, y1 = points[i]\n            x2, y2 = points[j]\n            \n            if (x1 + x2) % 2 == 0 and (y1 + y2) % 2 == 0:\n                mid_x = (x1 + x2) // 2\n                mid_y = (y1 + y2) // 2\n                if (mid_x, mid_y) in point_set:\n                    count += 1\n                    \n    print(count)\n\nif __name__ == \&quot;__main__\&quot;:\n    solve()\n```&quot;, &quot;code&quot;: &quot;import sys\n\ndef solve():\n    n = int(sys.stdin.readline())\n    points = []\n    for _ in range(n):\n        x, y = map(int, sys.stdin.readline &lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
